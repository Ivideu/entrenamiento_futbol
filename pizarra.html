<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pizarra Táctica Futsal 3D Pro</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #121212; 
            color: #ffffff; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00ff88; margin-bottom: 5px; text-align: center; }
        p { color: #aaa; margin-top: 0; margin-bottom: 25px; text-align: center; }
        
        .controls { 
            display: flex; 
            gap: 15px; 
            background: #1e1e1e; 
            padding: 12px 25px; 
            border-radius: 30px; 
            border: 1px solid #333;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button { 
            background: #00ff88; color: #000; border: none; 
            padding: 10px 20px; font-weight: bold; border-radius: 20px; 
            cursor: pointer; transition: all 0.2s;
        }
        button:hover { background: #00cc6e; transform: scale(1.05); }
        #btnStop { background: #ff4444; color: white; display: none; }
        #btnStop:hover { background: #cc3333; }
        #status { align-self: center; font-style: italic; color: #aaa; font-size: 14px; }

        #pizarraContainer {
            position: relative;
            width: 1000px;
            height: 600px;
            background: #4a503d; 
            border-radius: 12px;
            border: 4px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow: hidden;
            touch-action: none;   /* 🚫 Bloquea el desplazamiento del dedo en el contenedor */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;          /* Hace que el lienzo azul se encoja al tamaño del móvil */
            height: 100%;
            cursor: grab;
            touch-action: none;   /* 🚫 Bloquea que el móvil intente hacer scroll al arrastrar fichas */
}
        canvas:active { cursor: grabbing; }
    </style>
</head>
<body>

    <h1>Pizarra de Fútbol Sala 3D</h1>
    <p>Mueve las fichas sobre el parqué azul en perspectiva reglamentaria</p>
    
    <div class="controls">
        <button id="btnStart">🔴 Iniciar Grabación de Sesión</button>
        <button id="btnStop">⏹️ Detener y Descargar Video</button>
        <span id="status">Listo para entrenar</span>
    </div>

    <div id="pizarraContainer">
        <canvas id="tacticBoard" width="1000" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('tacticBoard');
        const ctx = canvas.getContext('2d');

        // Definición de Jugadores y Balón
        let players = [
            // Equipo Rojo (Defensa / Portero)
            { id: 1, x: 500, y: 500, color: '#ff3333', number: '1', radius: 18, isDragging: false },
            { id: 2, x: 500, y: 400, color: '#ff3333', number: '2', radius: 18, isDragging: false },
            { id: 3, x: 350, y: 320, color: '#ff3333', number: '3', radius: 18, isDragging: false },
            { id: 4, x: 650, y: 320, color: '#ff3333', number: '4', radius: 18, isDragging: false },
            { id: 5, x: 500, y: 200, color: '#ff3333', number: '5', radius: 18, isDragging: false },
            
            // Equipo Amarillo (Ataque)
            { id: 6, x: 580, y: 160, color: '#ffcc00', number: '1', radius: 18, isDragging: false, textColor: '#000' },
            { id: 7, x: 350, y: 220, color: '#ffcc00', number: '2', radius: 18, isDragging: false, textColor: '#000' },
            { id: 8, x: 500, y: 260, color: '#ffcc00', number: '3', radius: 18, isDragging: false, textColor: '#000' },
            { id: 9, x: 620, y: 240, color: '#ffcc00', number: '4', radius: 18, isDragging: false, textColor: '#000' },
            { id: 10, x: 450, y: 420, color: '#ffcc00', number: '5', radius: 18, isDragging: false, textColor: '#000' },
            
            // Balón Oficial (Blanco y Negro)
            { id: 99, x: 500, y: 300, color: '#ffffff', number: '⚽', radius: 12, isDragging: false, textColor: '#000' }
        ];
        let activePlayer = null;
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Cancha Azul de Fútbol Sala en Perspectiva Cónica
            ctx.fillStyle = '#1d70b8';
            ctx.beginPath();
            ctx.moveTo(280, 60);   // Línea de fondo superior
            ctx.lineTo(720, 60);   // Línea de fondo superior
            ctx.lineTo(920, 520);  // Línea de fondo cercana (más ancha)
            ctx.lineTo(80, 520);   // Línea de fondo cercana (más ancha)
            ctx.closePath();
            ctx.fill();
            
            // Líneas perimetrales blancas principales
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();

            // 2. Línea de Medio Campo
            ctx.beginPath();
            ctx.moveTo(180, 290);
            ctx.lineTo(820, 290);
            ctx.stroke();

            // 3. Círculo Central en Perspectiva (Elipse achatada)
            ctx.beginPath();
            ctx.ellipse(500, 290, 80, 28, 0, 0, 2 * Math.PI);
            ctx.stroke();

            // 4. Área de Penalti Superior (Inclinación 3D)
            ctx.beginPath();
            ctx.ellipse(500, 60, 130, 50, 0, 0, Math.PI);
            ctx.stroke();

            // 5. Área de Penalti Inferior (Inclinación 3D)
            ctx.beginPath();
            ctx.ellipse(500, 520, 160, 65, 0, Math.PI, 2 * Math.PI);
            ctx.stroke();

            // 6. Postes de Portería en Relieve 3D Estilo Red
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ffffff';
            // Portería de Fondo Superior (Perspectiva lejana)
            ctx.strokeRect(460, 30, 80, 30);
            // Portería de Fondo Inferior (Perspectiva cercana)
            ctx.strokeRect(450, 520, 100, 45);

            // 7. Renderizado Dinámico de cada Ficha
            players.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Números o Iconos Interiores
                ctx.fillStyle = p.textColor || '#ffffff';
                ctx.font = p.id === 99 ? '14px Arial' : 'bold 15px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.number, p.x, p.y);
            });
        }
        // Localizador de coordenadas exactas en pantalla
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function onMouseDown(e) {
            const pos = getMousePos(e);
            // Comprobación de qué ficha se está seleccionando
            for (let i = players.length - 1; i >= 0; i--) {
                const p = players[i];
                if (Math.hypot(p.x - pos.x, p.y - pos.y) < p.radius) {
                    activePlayer = p;
                    break;
                }
            }
        }

        function onMouseMove(e) {
            if (activePlayer) {
                const pos = getMousePos(e);
                activePlayer.x = pos.x;
                activePlayer.y = pos.y;
                drawBoard();
            }
        }

        function onMouseUp() { activePlayer = null; }

        // Oyentes de eventos para ordenadores de escritorio
        canvas.addEventListener('mousedown', onMouseDown);
        canvas.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);

        // Oyentes con tecnología táctil optimizada para Tablets y Smartphones
        canvas.addEventListener('touchstart', onMouseDown, { passive: true });
        canvas.addEventListener('touchmove', onMouseMove, { passive: true });
        canvas.addEventListener('touchend', onMouseUp);

        // Inicialización y primer renderizado gráfico de la cancha
        drawBoard();

        // 📽️ SISTEMA INTEGRADO DE GRABACIÓN DIGITAL (MediaRecorder)
        let mediaRecorder;
        let recordedChunks = [];
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusText = document.getElementById('status');

        btnStart.addEventListener('click', async () => {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { mediaSource: "screen" },
                    audio: true 
                });

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `sesion_táctica_futsal_${new Date().toISOString().slice(0,10)}.webm`;
                    a.click();
                    
                    statusText.innerText = "Video guardado.";
                    statusText.style.color = "#aaa";
                    btnStart.style.display = "inline-block";
                    btnStop.style.display = "none";
                };

                mediaRecorder.start();
                statusText.innerText = "🎥 GRABANDO SESIÓN...";
                statusText.style.color = "#ff4444";
                btnStart.style.display = "none";
                btnStop.style.display = "inline-block";

                stream.getVideoTracks().onended = () => { if (mediaRecorder.state !== "inactive") mediaRecorder.stop(); };
            } catch (err) {
                statusText.innerText = "Grabación cancelada.";
            }
        });

        btnStop.addEventListener('click', () => {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
        });
    </script>
</body>
</html>
