<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra Táctica de Fútbol Sala</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #121212; 
            color: #ffffff; 
        }
        h1 { 
            text-align: center; 
            color: #00ff88;
            margin-bottom: 5px;
        }
        p {
            text-align: center;
            color: #aaaaaa;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            max-width: 1200px;
            margin: 0 auto;
        }
        .controls { 
            display: flex; 
            gap: 15px; 
            background: #1e1e1e; 
            padding: 15px 25px; 
            border-radius: 30px; 
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button { 
            background: #00ff88; 
            color: #000000; 
            border: none; 
            padding: 12px 24px; 
            font-weight: bold; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        button:hover { 
            background: #00cc6e; 
            transform: scale(1.05);
        }
        #btnStop { 
            background: #ff4444; 
            color: white; 
            display: none; 
        }
        #btnStop:hover { 
            background: #cc3333; 
        }
        .status-container {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #00ff88;
        }

        /* 🟢 TRUCO ANTIANUNCIOS: Contenedor que recorta los bordes */
        .pizarra-wrapper {
            width: 100%;
            max-width: 1000px; /* Ajusta al ancho de la pizarra */
            height: 600px;     /* Oculta el anuncio inferior */
            overflow: hidden;  /* Esconde todo lo que sobresalga */
            position: relative;
            border: 2px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* Desplaza la página interna hacia arriba para esconder el anuncio superior */
        .pizarra-wrapper iframe {
            position: absolute;
            top: -95px;       /* Empuja el anuncio de arriba fuera de la vista */
            left: 0;
            width: 100%;
            height: 750px;     /* Le da suficiente margen interno */
            border: none;
        }
    </style>
</head>
<body>

    <h1>Pizarra de Fútbol Sala Interactiva</h1>
    <p>Diseña tus jugadas en tiempo real y graba la sesión para tus jugadores</p>
    
    <div class="container">
        <!-- Panel de Control para Grabar la Sesión -->
        <div class="controls">
            <button id="btnStart">🔴 Iniciar Grabación de Táctica</button>
            <button id="btnStop">⏹️ Detener y Descargar Video</button>
            <div class="status-container">
                <span id="status" style="font-style: italic; color: #aaa;">Listo para explicar</span>
            </div>
        </div>

        <!-- Contenedor con máscara de recorte aplicada -->
        <div class="pizarra-wrapper">
            <iframe src="https://tactical-board.com"></iframe>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];

        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusText = document.getElementById('status');

        btnStart.addEventListener('click', async () => {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { mediaSource: "screen" },
                    audio: true 
                });

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `tactica_futsal_${new Date().toISOString().slice(0,10)}.webm`;
                    a.click();
                    
                    statusText.innerText = "Grabación descargada.";
                    statusText.style.color = "#aaa";
                    btnStart.style.display = "inline-block";
                    btnStop.style.display = "none";
                };

                mediaRecorder.start();
                statusText.innerText = "🎥 GRABANDO LA PIZARRA...";
                statusText.style.color = "#ff4444";
                btnStart.style.display = "none";
                btnStop.style.display = "inline-block";

                stream.getVideoTracks().onended = () => {
                    if (mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                    }
                };

            } catch (err) {
                console.error("Error al acceder a la grabación: ", err);
                statusText.innerText = "Grabación cancelada o no admitida.";
                statusText.style.color = "#ff4444";
            }
        });

        btnStop.addEventListener('click', () => {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
        });
    </script>
</body>
</html>
