<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra Táctica de Fútbol Sala</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #1a1a1a; color: #fff; }
        h1 { text-align: center; color: #00ff88; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .controls { display: flex; gap: 15px; background: #2a2a2a; padding: 15px; border-radius: 8px; }
        button { background: #00ff88; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #00cc6e; }
        #btnStop { background: #ff4444; color: white; display: none; }
        #btnStop:hover { background: #cc3333; }
        iframe { border: 3px solid #00ff88; border-radius: 8px; background: #fff; }
    </style>
</head>
<body>

    <h1>Pizarra de Fútbol Sala Interactiva</h1>
    
    <div class="container">
        <!-- Panel de Control para Grabar la Sesión -->
        <div class="controls">
            <button id="btnStart">🔴 Iniciar Grabación de Táctica</button>
            <button id="btnStop">⏹️ Detener y Descargar Video</button>
            <span id="status" style="align-self: center; font-style: italic; color: #aaa;">Listo para grabar</span>
        </div>

        <!-- Pizarra de Fútbol Sala Integrada -->
        <iframe 
            src="https://tacticalboard.com" 
            width="100%" 
            height="650px">
        </iframe>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];

        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusText = document.getElementById('status');

        // Captura la pantalla o pestaña para grabar la sesión dinámica
        btnStart.addEventListener('click', async () => {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { mediaSource: "screen" },
                    audio: true // Actívalo si quieres explicar la jugada con tu micrófono
                });

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    // Descarga automática del archivo de video
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `tactica_futsal_${new Date().toISOString().slice(0,10)}.webm`;
                    a.click();
                    
                    statusText.innerText = "Grabación descargada.";
                    btnStart.style.display = "inline-block";
                    btnStop.style.display = "none";
                };

                mediaRecorder.start();
                statusText.innerText = "🔴 Grabando la pizarra...";
                btnStart.style.display = "none";
                btnStop.style.display = "inline-block";

            } catch (err) {
                console.error("Error al acceder a la grabación: ", err);
                statusText.innerText = "Error al iniciar la grabación.";
            }
        });

        btnStop.addEventListener('click', () => {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
        });
    </script>
</body>
</html>
