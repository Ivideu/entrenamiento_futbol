<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pizarra Futsal Móvil y PC</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; 
            background-color: #f1f5f9; color: #1a202c; 
            display: flex; flex-direction: column; align-items: center; 
            width: 100vw; height: 100vh; overflow: hidden;
        }
        
        /* 📱 DISEÑO POR DEFECTO (Móvil) */
        #pizarraContainer { 
            position: relative; width: 100%; height: calc(100vh - 70px); 
            background: #e2e8f0; touch-action: none; 
        }
        canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            cursor: grab; touch-action: none; 
        }
        canvas:active { cursor: grabbing; }
        
        .controls { 
            display: flex; gap: 12px; background: #f8fafc; width: 100%; height: 70px;
            box-sizing: border-box; padding: 15px 20px; border-top: 2px solid #e2e8f0; 
            justify-content: center; align-items: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); z-index: 10;
        }
        button { 
            background: #1d70b8; color: #ffffff; border: none; padding: 10px 16px; 
            font-weight: bold; border-radius: 20px; cursor: pointer; transition: all 0.2s; font-size: 14px;
        }
        button:hover { background: #15538a; }
        #btnStop { background: #ef4444; display: none; }
        #btnStop:hover { background: #dc2626; }
        #btnClear { background: #64748b; color: #fff; }
        #btnClear:hover { background: #475569; }
        #status { font-style: italic; color: #64748b; font-size: 13px; font-weight: 500; margin-left: 5px; }

        /* 💻 ADAPTACIÓN AUTOMÁTICA PARA PC (Al 50%) */
        @media (min-width: 992px) and (orientation: landscape) {
            body { background-color: #0f172a; justify-content: center; padding-top: 15px; }
            #pizarraContainer { 
                width: 50vw; height: 78vh; border-radius: 12px;
                border: 4px solid #334155; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); margin-bottom: 15px;
            }
            .controls {
                width: 50vw; border-radius: 30px; border: 2px solid #334155;
                height: 65px; background: #1e293b; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            }
            #status { color: #94a3b8; }
        }
    </style>
</head>
<body>

    <div id="pizarraContainer">
        <canvas id="tacticBoard"></canvas>
    </div>

    <div class="controls">
        <button id="btnStart">🔴 Grabar</button>
        <button id="btnStop">⏹️ Detener</button>
        <button id="btnClear">🗑️ Limpiar</button>
        <span id="status">Listo</span>
    </div>

    <script>
        const canvas = document.getElementById('tacticBoard');
        const ctx = canvas.getContext('2d');
        // Base de datos de jugadores con sus coordenadas porcentuales fijas
        let players = [
            { id: 1, x: 0.5, y: 0.92, type: 'stripe', baseColor: '#ffffff', stripeColor: '#8b5cf6', number: '1', radius: 18, tColor: '#000' }, 
            { id: 2, x: 0.5, y: 0.78, type: 'stripe', baseColor: '#1d70b8', stripeColor: '#eab308', number: '2', radius: 18, tColor: '#fff' },
            { id: 3, x: 0.25, y: 0.65, type: 'stripe', baseColor: '#1d70b8', stripeColor: '#eab308', number: '3', radius: 18, tColor: '#fff' },
            { id: 4, x: 0.75, y: 0.65, type: 'stripe', baseColor: '#1d70b8', stripeColor: '#eab308', number: '4', radius: 18, tColor: '#fff' },
            { id: 5, x: 0.5, y: 0.56, type: 'stripe', baseColor: '#1d70b8', stripeColor: '#eab308', number: '5', radius: 18, tColor: '#fff' },
            
            { id: 6, x: 0.5, y: 0.08, type: 'solid', baseColor: '#eab308', number: '1', radius: 18, tColor: '#000' },
            { id: 7, x: 0.5, y: 0.22, type: 'solid', baseColor: '#eab308', number: '2', radius: 18, tColor: '#000' },
            { id: 8, x: 0.25, y: 0.35, type: 'solid', baseColor: '#eab308', number: '3', radius: 18, tColor: '#000' },
            { id: 9, x: 0.75, y: 0.35, type: 'solid', baseColor: '#eab308', number: '4', radius: 18, tColor: '#000' },
            { id: 10,x: 0.5, y: 0.44, type: 'solid', baseColor: '#eab308', number: '5', radius: 18, tColor: '#000' },
            
            { id: 99, x: 0.5, y: 0.5, type: 'ball', baseColor: '#ffffff', number: '⚽', radius: 12, tColor: '#000' }
        ];

        let activePlayer = null, arrowStart = null, arrowCurrent = null, arrows = [];

        // Redimensionado instantáneo leyendo las medidas físicas del contenedor en tiempo real
        function resizeCanvas() {
            const container = document.getElementById('pizarraContainer');
            canvas.width = container.getBoundingClientRect().width || container.clientWidth;
            canvas.height = container.getBoundingClientRect().height || container.clientHeight;
            
            // Forzar actualización inmediata de las coordenadas de las fichas en píxeles
            players.forEach(p => {
                p.px = p.x * canvas.width;
                p.py = p.y * canvas.height;
            });
            drawBoard();
        }

        function drawBoard() {
            if (!canvas.width || !canvas.height) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Suelo texturizado de madera parqué
            const w = canvas.width, h = canvas.height, bH = 16; 
            for (let y = 0; y < h; y += bH) {
                ctx.fillStyle = (Math.floor(y / bH) % 2 === 0) ? '#f3d5ab' : '#ebd0a3';
                ctx.fillRect(0, y, w, bH);
                ctx.strokeStyle = 'rgba(139, 92, 26, 0.06)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }

            // Marcas azules del campo reglamentario
            ctx.strokeStyle = '#1d70b8'; ctx.lineWidth = 4;
            const pX = 25, pY = 25, cw = w - (pX * 2), ch = h - (pY * 2);
            ctx.strokeRect(pX, pY, cw, ch); 

            const midY = pY + ch / 2;
            ctx.beginPath(); ctx.moveTo(pX, midY); ctx.lineTo(pX + cw, midY); ctx.stroke(); 

            const rCenter = Math.min(cw, ch) * 0.12;
            ctx.beginPath(); ctx.arc(w / 2, midY, rCenter, 0, 2 * Math.PI); ctx.stroke(); 

            const aRadius = Math.min(cw, ch) * 0.18;
            ctx.beginPath(); ctx.arc(w / 2, pY, aRadius, 0, Math.PI); ctx.stroke(); 
            ctx.beginPath(); ctx.arc(w / 2, pY + ch, aRadius, Math.PI, 2 * Math.PI); ctx.stroke(); 

            // Porterías rectangulares grises
            ctx.strokeStyle = '#64748b'; const gW = cw * 0.2;
            ctx.strokeRect(w / 2 - gW / 2, pY - 12, gW, 12);
            ctx.strokeRect(w / 2 - gW / 2, pY + ch, gW, 12);

            // Dibujar las flechas tácticas rojas guardadas
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5;
            arrows.forEach(a => drawArrow(ctx, a.start.x * canvas.width, a.start.y * canvas.height, a.end.x * canvas.width, a.end.y * canvas.height));
            
            if (arrowStart && arrowCurrent) {
                ctx.strokeStyle = '#64748b'; 
                drawArrow(ctx, arrowStart.x, arrowStart.y, arrowCurrent.x, arrowCurrent.y);
            }

            // Dibujar las camisetas de los jugadores
            players.forEach(p => {
                ctx.save(); ctx.beginPath(); ctx.arc(p.px, p.py, p.radius, 0, 2 * Math.PI);
                ctx.fillStyle = p.baseColor; ctx.fill();

                if (p.type === 'stripe') {
                    ctx.clip(); ctx.fillStyle = p.stripeColor;
                    ctx.fillRect(p.px - 4, p.py - p.radius, 8, p.radius * 2);
                }
                ctx.restore();

                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(p.px, p.py, p.radius, 0, 2 * Math.PI); ctx.stroke();

                ctx.fillStyle = p.tColor || '#ffffff'; ctx.font = p.type === 'ball' ? '14px Arial' : 'bold 15px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(p.number, p.px, p.py);
            });
        }
        function drawArrow(context, fx, fy, tx, ty) {
            const len = 12; const dx = tx - fx; const dy = ty - fy; const angle = Math.atan2(dy, dx);
            context.beginPath(); context.moveTo(fx, fy); context.lineTo(tx, ty); context.stroke();
            context.beginPath(); context.moveTo(tx, ty);
            context.lineTo(tx - len * Math.cos(angle - Math.PI / 6), ty - len * Math.sin(angle - Math.PI / 6));
            context.lineTo(tx - len * Math.cos(angle + Math.PI / 6), ty - len * Math.sin(angle + Math.PI / 6));
            context.closePath(); context.fillStyle = context.strokeStyle; context.fill();
        }

        // Sistema de captura de coordenadas corregido para pantallas táctiles y ratón
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function down(e) {
            const pos = getPos(e); let hit = false;
            for (let i = players.length - 1; i >= 0; i--) {
                if (Math.hypot(players[i].px - pos.x, players[i].py - pos.y) < players[i].radius) {
                    activePlayer = players[i]; hit = true; break;
                }
            }
            if (!hit) { arrowStart = pos; arrowCurrent = pos; }
        }

        function move(e) {
            if (!activePlayer && !arrowStart) return;
            const pos = getPos(e);
            if (activePlayer) { activePlayer.px = pos.x; activePlayer.py = pos.y; drawBoard(); }
            else if (arrowStart) { arrowCurrent = pos; drawBoard(); }
        }

        function up() {
            if (arrowStart && arrowCurrent && Math.hypot(arrowCurrent.x - arrowStart.x, arrowCurrent.y - arrowStart.y) > 12) {
                // Guarda las flechas de forma porcentual para que no se muevan de su sitio al girar la pantalla
                arrows.push({ 
                    start: { x: arrowStart.x / canvas.width, y: arrowStart.y / canvas.height }, 
                    end: { x: arrowCurrent.x / canvas.width, y: arrowCurrent.y / canvas.height } 
                });
            }
            if (activePlayer) {
                activePlayer.x = activePlayer.px / canvas.width;
                activePlayer.y = activePlayer.py / canvas.height;
            }
            activePlayer = null; arrowStart = null; arrowCurrent = null; drawBoard();
        }

        // Activadores táctiles reactivos independientes
        canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
        canvas.addEventListener('touchstart', down, { passive: true }); canvas.addEventListener('touchmove', move, { passive: true }); canvas.addEventListener('touchend', up);
        
        window.addEventListener('resize', resizeCanvas);
        
        // Ejecución retrasada controlada para asegurar que el móvil asigne las medidas correctamente
        window.addEventListener('load', () => { setTimeout(resizeCanvas, 150); });

        document.getElementById('btnClear').addEventListener('click', () => {
            arrows = []; drawBoard();
        });

        // Grabador nativo de video
        let recorder, chunks = [];
        const btnStart = document.getElementById('btnStart'), btnStop = document.getElementById('btnStop'), statusText = document.getElementById('status');

        btnStart.addEventListener('click', async () => {
            chunks = [];
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url;
                    a.download = `futsal_pabellon_${new Date().toISOString().slice(0,10)}.webm`; a.click();
                    statusText.innerText = "Listo"; btnStart.style.display = "inline-block"; btnStop.style.display = "none";
                };
                recorder.start(); statusText.innerText = "🎥 GRABANDO..."; statusText.style.color = "#ef4444";
                btnStart.style.display = "none"; btnStop.style.display = "inline-block";
            } catch (err) { statusText.innerText = "Cancelado"; }
        });
        btnStop.addEventListener('click', () => { recorder.stop(); recorder.stream.getTracks().forEach(t => t.stop()); });
    </script>
</body>
</html>
